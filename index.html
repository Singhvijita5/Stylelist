/* ===== Platform layer: shared fixes + iOS (HIG) + Android (Material 3) ===== */
html{overscroll-behavior-y:none}
a,button,label,.th,.opt,.chip{touch-action:manipulation}
input,select,textarea,.wn,#tp,#tn{font-size:16px}  /* stops iOS zoom-on-focus */

.hd{padding-top:max(6px,env(safe-area-inset-top))}

[data-os=ios] button,[data-os=ios] .btn{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
[data-os=ios] body{font-family:-apple-system,"SF Pro Text",var(--sans)}

[data-os=android]{--sans:Roboto,"Google Sans",system-ui,sans-serif;--r:16px}
[data-os=android] body{font-family:var(--sans);letter-spacing:0}

[data-os=android] .btn::after,[data-os=android] .chip::after,[data-os=android] .go::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s;pointer-events:none}
[data-os=android] .btn:active::after,[data-os=android] .chip:active::after,[data-os=android] .go:active::after{opacity:.12}
[data-os=android] .chip{border-radius:10px;position:relative;overflow:hidden;font-size:14px;letter-spacing:.1px;min-height:48px}
[data-os=android] .ib{min-width:48px;min-height:48px}
[data-os=android] .go{text-transform:none;letter-spacing:.1px;font-size:13px;font-weight:600;position:relative;overflow:hidden;min-height:40px}
[data-os=android] .pill{text-transform:none;letter-spacing:.2px;font-size:12px}
[data-os=android] .hd{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg);border-bottom:0;box-shadow:0 1px 0 var(--line)}
[data-os=android] .hd>b{letter-spacing:0;font-size:22px}
[data-os=android] .card{border-radius:20px;box-shadow:none;border:1px solid var(--line)}
[data-os=android] .opt,[data-os=android] .th{border-radius:16px}
[data-os=android] .sheet{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.12)}
[data-os=android] .sheet::before,[data-os=android] .pn::before{width:32px;height:4px;margin-left:-16px;opacity:.5;background:var(--mut)}
[data-os=android] .fab{border-radius:18px;letter-spacing:.1px;text-transform:none;font-size:15px;height:56px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
[data-os=android] .bp,[data-os=android] .toast{border-radius:20px}

/* ===== Minimalist luxury: White #FFFFFF, Charcoal #1A1A1A, Cream #F6F2EB, Muted Gold #C8A868, Soft Taupe #A89D8E ===== */
html:root{--white:#FFFFFF;--char:#1A1A1A;--cream:#F6F2EB;--gold:#C8A868;--taupe:#A89D8E;--goldt:#7D6325;
--bg:#FFFFFF;--card:#FFFFFF;--ink:#1A1A1A;--mut:#6B645B;--line:rgba(26,26,26,.12);--fill:#F6F2EB;--fill2:#E9E2D6;--acc:#1A1A1A;--accb:#1A1A1A;--btn:#1A1A1A;--btnt:#FFFFFF;--sel:#1A1A1A;--tint:#F6F2EB;--mat:rgba(255,255,255,.92);--ok:#2F6B12;--pk:#B3261E;--mint:#C8A868;--vio:#1A1A1A;
--serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;--display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;--sans:Jost,"Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;--r:12px}

body{background:var(--bg);font-weight:400}
input[type=range],input[type=checkbox]{accent-color:var(--acc)}

h1,h2,.fdesc>b,#sp .tg,.sheet b{font-family:var(--display)!important}
.hd>b:not(.lg){font-family:var(--sans)!important}
h1{font-size:32px;line-height:1.15;font-weight:400;letter-spacing:0}
h2{font-size:var(--t-head);line-height:1.2;font-weight:400;letter-spacing:0}

function csv(t){const R=[];let r=[],f='',q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';R.push(r);r=[]}else f+=c}if(f||r.length){r.push(f);R.push(r)}return R.filter(x=>x.join('').trim())}

const items=R.slice(1).map(r=>Object.fromEntries(H.map((h,i)=>[h,(r[i]||'').trim()]))).filter(x=>x.id&&x.name).map(x=>{const px=S.map(s=>x['price_'+s]?+x['price_'+s]:null);return{lux:Math.min(...px.filter(v=>v))>=20000,id:x.id,n:x.name,c:['b','f','d','ba','wa','gl','be','ea','ne'].includes(x.category)?x.category:'t',hex:x.color||'#999999',t:x.tones||'nwc',sh:L(x.shapes||'all'),o:L(x.occasions||'casual'),pr:Math.min(...px.filter(v=>v!=null))||0,st:L(x.styles||''),ft:x.fit||'n',cf:x.color_family||'N',g:x.department||'u',img:x.image_url||'',px,urls:S.map(s=>x['url_'+s]||'')}});
if(items.length){IT.length=0;IT.push(...items);if(V=='fit'){reset();draw()}}}catch(e){}}

b.style.background=bad.length?'#C5221A':'#0E7A5F';const by={};bad.forEach(a=>by[a.dataset.s||'?']=(by[a.dataset.s||'?']||0)+1);
b.textContent=bad.length?`${L.length-bad.length} of ${L.length} links earn commission. NOT earning: ${Object.entries(by).map(x=>x[0]+' ('+x[1]+')').join(', ')}. Fix config.js`:`All ${L.length} links earn commission`}
setInterval(run,1500)})();
